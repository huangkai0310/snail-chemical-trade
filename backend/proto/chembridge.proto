syntax = "proto3";

package chembridge;

option go_package = "github.com/huangkai0310/snail-chemical-trade/proto/gen/chembridge";

// ===== 订单服务 =====

service OrderService {
    rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
    rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
    rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
}

message PlaceOrderRequest {
    string product_id = 1;
    string side = 2;       // BUY | SELL
    double price = 3;
    double quantity = 4;
    string user_id = 5;
}

message PlaceOrderResponse {
    Order order = 1;
    repeated Trade trades = 2;
}

message Order {
    string id = 1;
    string product_id = 2;
    string side = 3;
    double price = 4;
    double quantity = 5;
    double filled = 6;
    string status = 7;
    string user_id = 8;
    int64 created_at = 9;
}

message Trade {
    string id = 1;
    string buy_order_id = 2;
    string sell_order_id = 3;
    string product_id = 4;
    double price = 5;
    double quantity = 6;
    int64 timestamp = 7;
}

message CancelOrderRequest {
    string order_id = 1;
    string user_id = 2;
}

message CancelOrderResponse {
    bool success = 1;
    string message = 2;
}

message GetOrderBookRequest {
    string product_id = 1;
}

message GetOrderBookResponse {
    string product_id = 1;
    repeated Order bids = 2;
    repeated Order asks = 3;
}
