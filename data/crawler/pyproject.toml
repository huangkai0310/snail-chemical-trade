[project]
name = "crawler"
version = "0.1.0"
description = "化工市场数据采集管线"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "click>=8.1",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
crawler = "crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
